<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ClawAgent v1.0 · 企业 AI 工作代理原型</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <svg class="svg-sprite" aria-hidden="true">
      <symbol id="icon-logo" viewBox="0 0 24 24">
        <path d="M4 7.5 12 3l8 4.5v9L12 21l-8-4.5v-9Z" fill="none" stroke="currentColor" stroke-width="1.6" />
        <path d="M8 9.2 12 7l4 2.2v4.6L12 16l-4-2.2V9.2Z" fill="currentColor" opacity=".16" />
        <path d="M12 7v9M8 9.2l8 4.6M16 9.2l-8 4.6" fill="none" stroke="currentColor" stroke-width="1.2" />
      </symbol>
      <symbol id="icon-search" viewBox="0 0 24 24">
        <path d="m20 20-4.2-4.2M10.8 18a7.2 7.2 0 1 1 0-14.4 7.2 7.2 0 0 1 0 14.4Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
      </symbol>
      <symbol id="icon-plus" viewBox="0 0 24 24">
        <path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />

      <symbol id="icon-agent" viewBox="0 0 24 24">
        <path d="M8 10V8a4 4 0 0 1 8 0v2M6.8 10h10.4A2.8 2.8 0 0 1 20 12.8v3.4a2.8 2.8 0 0 1-2.8 2.8H6.8A2.8 2.8 0 0 1 4 16.2v-3.4A2.8 2.8 0 0 1 6.8 10Z" fill="none" stroke="currentColor" stroke-width="1.6" />
        <path d="M9 14h.01M15 14h.01" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" />

      <symbol id="icon-skill" viewBox="0 0 24 24">
        <path d="M6 4.5h8.6L18 8v11.5H6V4.5Z" fill="none" stroke="currentColor" stroke-width="1.6" />
        <path d="M14.5 4.7V8H18M9 12h6M9 15h4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
      </symbol>
      <symbol id="icon-clock" viewBox="0 0 24 24">

        <path d="M12 7.5V12l3 2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />

      <symbol id="icon-heartbeat" viewBox="0 0 24 24">
        <path d="M4 12h3l2-5 4 10 2-5h5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
      </symbol>
      <symbol id="icon-foundry" viewBox="0 0 24 24">
        <path d="M5 7h14M7 7v12M17 7v12M9 11h6M8 19h8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
        <path d="M8 5h8v2H8V5Z" fill="currentColor" opacity=".14" />
      </symbol>
      <symbol id="icon-settings" viewBox="0 0 24 24">
        <path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z" fill="none" stroke="currentColor" stroke-width="1.6" />
        <path d="M19 12a7 7 0 0 0-.1-1.1l2-1.5-2-3.4-2.4 1a7.3 7.3 0 0 0-1.8-1L14.4 3h-4l-.3 3a7.3 7.3 0 0 0-1.8 1L5.9 6 4 9.4l2 1.5A7 7 0 0 0 6 12c0 .4 0 .8.1 1.1l-2 1.5 2 3.4 2.4-1c.6.4 1.1.8 1.8 1l.3 3h4l.3-3c.6-.2 1.2-.6 1.8-1l2.4 1 2-3.4-2-1.5c0-.3.1-.7.1-1.1Z" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round" />
      </symbol>
      <symbol id="icon-edit" viewBox="0 0 24 24">
        <path d="M4.5 19.5h4L19 9a2.1 2.1 0 0 0-3-3L5.5 16.5l-1 3Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" />
      </symbol>
      <symbol id="icon-share" viewBox="0 0 24 24">
        <path d="M8.5 12.5 15 16M15 8 8.5 11.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
        <path d="M6.5 14.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5ZM17.5 9.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5ZM17.5 19.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5Z" fill="none" stroke="currentColor" stroke-width="1.6" />
      </symbol>
      <symbol id="icon-export" viewBox="0 0 24 24">
        <path d="M12 4v10M8.5 7.5 12 4l3.5 3.5M5 14v4.5h14V14" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
      </symbol>
      <symbol id="icon-archive" viewBox="0 0 24 24">
        <path d="M5 8h14v12H5V8ZM4 4h16v4H4V4Z" fill="none" stroke="currentColor" stroke-width="1.6" />
        <path d="M9 12h6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
      </symbol>
      <symbol id="icon-file" viewBox="0 0 24 24">
        <path d="M6 3.5h8.5L18 7v13.5H6v-17Z" fill="none" stroke="currentColor" stroke-width="1.6" />
        <path d="M14.5 3.7V7H18M9 11h6M9 14h6M9 17h3.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
      </symbol>
      <symbol id="icon-terminal" viewBox="0 0 24 24">
        <path d="M4 5h16v14H4V5Z" fill="none" stroke="currentColor" stroke-width="1.6" />
        <path d="m7 9 3 3-3 3M11.5 16h5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
      </symbol>
      <symbol id="icon-globe" viewBox="0 0 24 24">
        <path d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18Z" fill="none" stroke="currentColor" stroke-width="1.6" />
        <path d="M3 12h18M12 3c2.2 2.4 3.3 5.4 3.3 9S14.2 18.6 12 21M12 3c-2.2 2.4-3.3 5.4-3.3 9s1.1 6.6 3.3 9" fill="none" stroke="currentColor" stroke-width="1.3" />
      </symbol>
      <symbol id="icon-code" viewBox="0 0 24 24">
        <path d="m9 8-4 4 4 4M15 8l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
      </symbol>
      <symbol id="icon-doc" viewBox="0 0 24 24">
        <path d="M5.5 4h13v16h-13V4Z" fill="none" stroke="currentColor" stroke-width="1.6" />
        <path d="M8.5 8h7M8.5 11h7M8.5 14h5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
      </symbol>
      <symbol id="icon-branch" viewBox="0 0 24 24">
        <path d="M7 7v10M7 17c0-4 10-2 10-7V7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
        <path d="M7 9a2 2 0 1 0 0-4 2 2 0 0 0 0 4ZM7 19a2 2 0 1 0 0-4 2 2 0 0 0 0 4ZM17 9a2 2 0 1 0 0-4 2 2 0 0 0 0 4Z" fill="none" stroke="currentColor" stroke-width="1.6" />
      </symbol>
      <symbol id="icon-multiagent" viewBox="0 0 24 24">
        <circle cx="12" cy="5" r="2.2" fill="none" stroke="currentColor" stroke-width="1.5" />
        <path d="M12 7.2v2.8M7.5 18 9.8 13.2M16.5 18 14.2 13.2" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
        <circle cx="6.5" cy="19" r="2" fill="none" stroke="currentColor" stroke-width="1.5" />
        <circle cx="12" cy="19" r="2" fill="none" stroke="currentColor" stroke-width="1.5" />
        <circle cx="17.5" cy="19" r="2" fill="none" stroke="currentColor" stroke-width="1.5" />
      </symbol>
      <symbol id="icon-check" viewBox="0 0 24 24">
        <path d="m5 12.5 4.2 4.2L19 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      </symbol>
      <symbol id="icon-x" viewBox="0 0 24 24">
        <path d="M7 7l10 10M17 7 7 17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
      </symbol>
      <symbol id="icon-chevron" viewBox="0 0 24 24">
        <path d="m8 10 4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
      </symbol>
      <symbol id="icon-play" viewBox="0 0 24 24">
        <path d="m8 5 11 7-11 7V5Z" fill="currentColor" />
      </symbol>
      <symbol id="icon-pause" viewBox="0 0 24 24">
        <path d="M8 5h3v14H8V5ZM13 5h3v14h-3V5Z" fill="currentColor" />
      </symbol>
      <symbol id="icon-attach" viewBox="0 0 24 24">
        <path d="m8.5 12.8 5.7-5.7a3 3 0 0 1 4.2 4.2l-7.1 7.1a4.5 4.5 0 0 1-6.4-6.4l7.1-7.1" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
      </symbol>
      <symbol id="icon-mic" viewBox="0 0 24 24">
        <path
          d="M12 14.5a3.25 3.25 0 0 0 3.25-3.25V7.75a3.25 3.25 0 0 0-6.5 0v3.5A3.25 3.25 0 0 0 12 14.5Z"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linejoin="round"
        />
        <path
          d="M5.5 11a6.5 6.5 0 0 0 13 0M12 18.25V21M9 21h6"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </symbol>
      <symbol id="icon-send" viewBox="0 0 24 24">
        <path d="M4 4.5 20 12 4 19.5l2-6.2L14 12l-8-1.3-2-6.2Z" fill="currentColor" />
      </symbol>
      <symbol id="icon-spark" viewBox="0 0 24 24">
        <path d="M12 3.5 13.8 9l5.7 3-5.7 3L12 20.5 10.2 15l-5.7-3 5.7-3L12 3.5Z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" />
      </symbol>
      <symbol id="icon-mouse" viewBox="0 0 24 24">
        <path d="M12 3.5a6 6 0 0 1 6 6v5a6 6 0 0 1-12 0v-5a6 6 0 0 1 6-6Z" fill="none" stroke="currentColor" stroke-width="1.6" />
        <path d="M12 4v6M12 10h6" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
      </symbol>
      <symbol id="icon-warning" viewBox="0 0 24 24">
        <path d="M12 4 21 20H3L12 4Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" />
        <path d="M12 9v5M12 17.5h.01" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
      </symbol>
      <symbol id="icon-info" viewBox="0 0 24 24">
        <path d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18Z" fill="none" stroke="currentColor" stroke-width="1.6" />
        <path d="M12 11v5M12 8h.01" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
      </symbol>
      <symbol id="icon-eye" viewBox="0 0 24 24">
        <path d="M3.5 12s3-5.5 8.5-5.5S20.5 12 20.5 12s-3 5.5-8.5 5.5S3.5 12 3.5 12Z" fill="none" stroke="currentColor" stroke-width="1.6" />
        <path d="M12 14.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5Z" fill="none" stroke="currentColor" stroke-width="1.6" />
      </symbol>
      <symbol id="icon-download" viewBox="0 0 24 24">
        <path d="M12 4v10M8.5 10.5 12 14l3.5-3.5M5 18h14" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
      </symbol>
      <symbol id="icon-cloud" viewBox="0 0 24 24">
        <path d="M8 18h9a4 4 0 0 0 .5-8 6 6 0 0 0-11.3 2A3 3 0 0 0 8 18Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" />
      </symbol>
      <symbol id="icon-pin" viewBox="0 0 24 24">
        <path d="M8 5.5h8M10 5.5v4l-2.5 3h9L14 9.5v-4M12 12.5v6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
      </symbol>
      <symbol id="icon-more" viewBox="0 0 24 24">
        <path d="M12 6.8h.01M12 12h.01M12 17.2h.01" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" />
      </symbol>
      <symbol id="icon-trash" viewBox="0 0 24 24">
        <path d="M5 7.5h14M9 7.5V5h6v2.5M8.2 7.5l.7 10.5h6.2l.7-10.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M10.2 10.5v5M13.8 10.5v5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
      </symbol>
    </svg>

    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand-row">
          <div class="brand-mark"><svg><use href="#icon-logo"></use></svg></div>
          <div>
            <div class="brand-name">ClawAgent</div>
            <div class="brand-version">v1.0 企业工作代理</div>
          </div>
        </div>

        <label class="search-box" aria-label="搜索任务">
          <svg><use href="#icon-search"></use></svg>
          <input type="search" placeholder="搜索任务" />
        </label>

        <nav class="nav-list" aria-label="主导航">
          <button class="nav-item active" type="button"><svg><use href="#icon-plus"></use></svg><span>新建任务</span></button>
          <button class="nav-item" type="button"><svg><use href="#icon-agent"></use></svg><span>企业级智能体</span></button>
          <button class="nav-item" type="button"><svg><use href="#icon-skill"></use></svg><span>SkillHub</span></button>
          <button class="nav-item" type="button"><svg><use href="#icon-clock"></use></svg><span>自动化任务</span></button>
          <button class="nav-item" type="button"><svg><use href="#icon-heartbeat"></use></svg><span>心跳</span></button>
        </nav>

        <section class="recent-section">
          <div class="recent-task-list" id="recentTaskList"></div>
        </section>

        <div class="sidebar-bottom">
          <button class="sidebar-link" type="button"><svg><use href="#icon-foundry"></use></svg><span>Agent Foundry</span></button>
          <button class="sidebar-link" type="button"><svg><use href="#icon-settings"></use></svg><span>高级配置</span></button>
          <div class="user-card">
            <div class="avatar">张</div>
            <div class="user-meta">
              <div class="user-name">张三</div>
              <div class="user-role">财务运营 · 产品部</div>
            </div>
          </div>
        </div>
      </aside>

      <main class="main-area">
        <header class="session-header">
          <div class="session-title-group">
            <h1>上海出差报销申请</h1>
            <p>会话 ID: sess-expense-20260423 · 项目: 企业差旅运营</p>
          </div>
          <div class="header-actions">
            <button class="icon-button" type="button" title="重命名"><svg><use href="#icon-edit"></use></svg></button>
            <button class="icon-button" type="button" title="分享"><svg><use href="#icon-share"></use></svg></button>
            <button class="icon-button" type="button" title="导出"><svg><use href="#icon-export"></use></svg></button>
            <button class="icon-button" type="button" title="归档"><svg><use href="#icon-archive"></use></svg></button>
          </div>
        </header>

        <div class="notice-stack" id="noticeStack" aria-live="polite"></div>

        <section class="message-stream" id="messageStream" aria-label="消息流"></section>

        <section class="composer-card">
          <div class="execution-strip" id="executionStrip">
            <button type="button">停止</button>
            <span></span>
            <button type="button">引导</button>
          </div>
          <div class="composer-input-wrap">
            <textarea
              id="composerTextarea"
              rows="2"
              placeholder="/ 键入以筛选或选择技能"
              autocomplete="off"
              spellcheck="false"
            ></textarea>
            <div class="skill-picker" id="skillPicker" hidden>
              <p class="skill-picker-hint" id="skillPickerHint" hidden>键入以筛选</p>
              <div class="skill-picker-scroll" id="skillPickerScroll" aria-label="技能列表区">
                <ul class="skill-picker-list" id="skillPickerList" role="listbox"></ul>
              </div>
              <div class="skill-hover-tip" id="skillHoverTip" hidden role="tooltip">
                <div class="skill-hover-tip-body">
                  <p class="skill-hover-tip-text" id="skillHoverTipText"></p>
                </div>
              </div>
            </div>
          </div>
          <div class="composer-footer">
            <div class="composer-tools">
              <button type="button" id="skillPickerBtn" aria-haspopup="listbox" aria-expanded="false">
                技能 <svg><use href="#icon-chevron"></use></svg>
              </button>
            </div>
            <div class="composer-send">
              <button class="attach-button" type="button" title="附件"><svg><use href="#icon-attach"></use></svg></button>
              <button class="voice-button" type="button" title="语音输入" aria-label="语音输入">
                <svg><use href="#icon-mic"></use></svg>
              </button>
              <button class="send-button" type="button" title="发送"><svg><use href="#icon-send"></use></svg></button>
            </div>
          </div>
        </section>

      </main>

      <aside class="right-panel">
        <section class="panel-card">
          <div class="panel-card-title">
            <h2>任务进程</h2>
            <span id="progressCount">0/5</span>
          </div>
          <div class="progress-list" id="progressList"></div>
        </section>
        <section class="panel-card">
          <div class="panel-card-title">
            <h2>任务文件</h2>
            <span id="fileCount">0</span>
          </div>
          <div class="file-list" id="fileList"></div>
        </section>
        <section class="panel-card">
          <div class="panel-card-title">
            <h2>工具</h2>
            <span id="contextCount">0</span>
          </div>
          <div class="context-list" id="contextList"></div>
        </section>
      </aside>
    </div>

    <script src="data.js"></script>
    <script src="app.js"></script>
  </body>
</html>
